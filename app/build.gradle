plugins {
    id 'com.android.application'
}

// Keep local builds small; CI requests all ABIs and split APKs explicitly.
def supportedAbis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
def requestedAbis = (findProperty('androidAbis') ?: 'arm64-v8a,x86_64').toString().split(',').collect { it.trim() }.unique()
if (requestedAbis.isEmpty() || requestedAbis.any { !supportedAbis.contains(it) }) {
    throw new GradleException("androidAbis must contain supported ABIs: ${supportedAbis.join(', ')}")
}
def rustJniDirectory = layout.buildDirectory.dir("rustJniLibs/${requestedAbis.join('_')}")

android {
    namespace 'com.ntroll.app'
    compileSdk 34
    ndkVersion '26.1.10909125'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.ntroll.app'
        testInstrumentationRunner 'com.ntroll.app.ProfilesTest'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '0.7.0'
        ndk {
            abiFilters.addAll(requestedAbis)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    splits {
        abi {
            enable = project.hasProperty('splitApks')
            reset()
            include(*requestedAbis as String[])
            universalApk = true
        }
    }

    sourceSets.main.jniLibs.srcDirs = [rustJniDirectory]
}

// Use the SDK and pinned NDK selected by Android Studio/Gradle as well as CLI builds.
def rustBuild = tasks.register('buildRust', Exec) {
    workingDir rootProject.projectDir
    def cargoHome = System.getenv('CARGO_HOME') ?: new File(System.getProperty('user.home'), '.cargo').absolutePath
    environment 'PATH', new File(cargoHome, 'bin').absolutePath + File.pathSeparator + System.getenv('PATH')
    environment 'ANDROID_HOME', android.sdkDirectory.absolutePath
    environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
    def arguments = ['cargo', 'ndk']
    requestedAbis.each { arguments.addAll(['-t', it]) }
    arguments.addAll(['--platform', '23', '-o', rustJniDirectory.get().asFile.absolutePath,
        'build', '--locked', '--release'])
    commandLine arguments
    inputs.property('androidAbis', requestedAbis)
    inputs.files(rootProject.file('Cargo.toml'), rootProject.file('Cargo.lock'))
    inputs.dir(rootProject.file('src'))
    outputs.dir(rustJniDirectory)
}

tasks.named('preBuild').configure {
    dependsOn rustBuild
}
