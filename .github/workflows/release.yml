name: Build Android release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.90.0'
  CARGO_NDK_VERSION: '4.1.2'
  ANDROID_ABIS: armeabi-v7a,arm64-v8a,x86,x86_64

jobs:
  build:
    name: Build and verify all Android ABIs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing repository secret: {name}. See docs/releases.md.')
          key = Path(os.environ['RUNNER_TEMP']) / 'ntroll-release.jks'
          key.touch(mode=0o600)
          key.write_bytes(base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_KEYSTORE_PATH={key}\n')
          PY

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install pinned Rust toolchain and Android targets
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Install Android SDK and NDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125'

      - name: Check policy and formatting
        run: |
          ./tests/run-policy-tests.sh
          cargo test --locked
          cargo fmt --check

      - name: Build release APKs and lint
        run: ./gradlew --no-daemon assembleRelease lintRelease -PandroidAbis="$ANDROID_ABIS" -PsplitApks

      - name: Verify and sign every APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/package-release.py --tag "$RELEASE_TAG"

      - name: Save signed release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ntroll-release.jks"

  publish:
    name: Attach APKs to GitHub release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release
          path: dist
      - name: Verify checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.apk SHA256SUMS --clobber
